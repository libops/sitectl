services:
  archivesspace:
    image: archivesspace:latest
  traefik:
    image: traefik:v3@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - --entryPoints.web.address=:80
      - --providers.file.directory=/etc/traefik/dynamic
