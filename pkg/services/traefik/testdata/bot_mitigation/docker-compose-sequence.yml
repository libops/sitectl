services:
  traefik:
    image: traefik:v3@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    command:
      - --api.dashboard=true
    volumes:
      - ./certs/cert.pem:/certs/cert.pem:ro,z
      - ./certs/privkey.pem:/certs/privkey.pem:ro,z
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    environment:
      TRAEFIK_LOG_LEVEL: INFO
  ojs:
    image: ojs
