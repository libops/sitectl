services:
  traefik:
    image: traefik:v3@sha256:5203c3f39ca70de6790d964624e042463ffbd57715bc82be155cf224c0dd5144
    command:
      - --api.dashboard=true
    volumes:
      - ./certs/cert.pem:/certs/cert.pem:ro,z
      - ./certs/privkey.pem:/certs/privkey.pem:ro,z
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    environment:
      TRAEFIK_LOG_LEVEL: INFO
  ojs:
    image: ojs
