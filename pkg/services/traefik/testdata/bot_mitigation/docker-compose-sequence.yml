services:
  traefik:
    image: traefik:v3@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    command:
      - --api.dashboard=true
    volumes:
      - ./certs/cert.pem:/certs/cert.pem:ro,z
      - ./certs/privkey.pem:/certs/privkey.pem:ro,z
      - ./conf/traefik:/etc/traefik/dynamic:ro,z
    environment:
      TRAEFIK_LOG_LEVEL: INFO
  ojs:
    image: ojs
